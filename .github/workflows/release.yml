# Each merge to main that changes collections/ is released on its own once the validator passes: the next
# version, its CHANGELOG section, and the tag vX.Y.Z (.github/scripts/release.py). ARGUS then offers the release
# on Administration › Catalogue, where a maintainer pins and installs it.
#
# Set the repository variable AUTO_RELEASE to "false" to release by hand (Actions › release › Run workflow).
# A protected main needs the github-actions app allowed to push the release commit.
name: release

on:
  push:
    branches: [main]
    paths: ["collections/**"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_RELEASE != 'false'
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The next version and its changelog
        id: next
        run: python .github/scripts/release.py >> "$GITHUB_OUTPUT"
      - name: Commit, tag and push
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Release $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin HEAD:main "$VERSION"
          echo "Released $VERSION" >> "$GITHUB_STEP_SUMMARY"
